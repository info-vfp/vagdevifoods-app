name: Build & Deploy

# Publishes the site to the `gh-pages` branch, which GitHub Pages already serves
# at vagdevifoods.com. Runs on every push to main, and can also be triggered by hand
# from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow pushing the built site back to the repository.
permissions:
  contents: write

# If several pushes land quickly, let the newest one win rather than queueing deploys.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check EmailJS configuration
        # Vite inlines these at build time. If they are missing the build still succeeds and
        # the site deploys fine — but the contact form silently stops sending, which is easy
        # to miss. Surface it as a warning on the run instead.
        run: |
          missing=""
          [ -n "${{ vars.VITE_EMAILJS_SERVICE_ID }}"  ] || missing="$missing VITE_EMAILJS_SERVICE_ID"
          [ -n "${{ vars.VITE_EMAILJS_TEMPLATE_ID }}" ] || missing="$missing VITE_EMAILJS_TEMPLATE_ID"
          [ -n "${{ vars.VITE_EMAILJS_PUBLIC_KEY }}"  ] || missing="$missing VITE_EMAILJS_PUBLIC_KEY"
          if [ -n "$missing" ]; then
            echo "::warning title=Contact form will not send::Missing repository variables:$missing — add them under Settings > Secrets and variables > Actions > Variables."
          else
            echo "All three EmailJS variables are present."
          fi

      - name: Build
        # Stored as repository *variables* (not secrets): all three are embedded in the
        # client bundle and readable in the browser, so they are not sensitive.
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ vars.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ vars.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ vars.VITE_EMAILJS_PUBLIC_KEY }}
        run: npm run build

      - name: Verify build output
        # Fail loudly here rather than publishing a broken site. The CNAME is what keeps
        # the custom domain attached — GitHub Pages drops it if the file goes missing.
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/CNAME     || { echo "::error::dist/CNAME missing — custom domain would be lost"; exit 1; }
          echo "Build size: $(du -sh dist | cut -f1)"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
