name: Build & Deploy

# Publishes the site to the `gh-pages` branch, which GitHub Pages already serves
# at vagdevifoods.com. Runs on every push to main, and can also be triggered by hand
# from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow pushing the built site back to the repository.
permissions:
  contents: write

# If several pushes land quickly, let the newest one win rather than queueing deploys.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # These are read at build time and baked into the bundle, so they must be present
        # here or the contact form will silently fail on the live site. Add them under
        # Settings -> Secrets and variables -> Actions.
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
        run: npm run build

      - name: Verify build output
        # Fail loudly here rather than publishing a broken site. The CNAME is what keeps
        # the custom domain attached — GitHub Pages drops it if the file goes missing.
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/CNAME     || { echo "::error::dist/CNAME missing — custom domain would be lost"; exit 1; }
          echo "Build size: $(du -sh dist | cut -f1)"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
