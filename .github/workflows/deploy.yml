name: Build & Deploy

# Publishes the site to the `gh-pages` branch, which GitHub Pages already serves
# at vagdevifoods.com. Runs on every push to main, and can also be triggered by hand
# from the Actions tab.
#
#   check → publish → confirm it is live → tell search engines
#
# Nothing is published unless `npm run check` passes (typecheck, style rules, build, SEO
# checks), and the run only goes green once the live site is serving the new build.
# Pull requests run the same check first, in ci.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow pushing the built site back to the repository.
permissions:
  contents: write

# One deploy at a time. A deploy that has started is allowed to finish — cancelling one
# mid-publish is how a half-updated site happens — and if several pushes land meanwhile,
# only the newest waits its turn.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check EmailJS configuration
        # Vite inlines these at build time. If they are missing or wrong the build still
        # succeeds and the site deploys fine — but the contact form silently stops sending,
        # which is easy to miss. Surface it as a warning on the run instead.
        #
        # Present-but-wrong is the failure that actually happened: a stale public key shipped
        # for weeks and every enquiry was lost, because the old check only tested that the
        # variables were non-empty. So the key is now validated against EmailJS itself.
        env:
          SERVICE_ID: ${{ vars.VITE_EMAILJS_SERVICE_ID }}
          TEMPLATE_ID: ${{ vars.VITE_EMAILJS_TEMPLATE_ID }}
          PUBLIC_KEY: ${{ vars.VITE_EMAILJS_PUBLIC_KEY }}
        run: |
          missing=""
          [ -n "$SERVICE_ID"  ] || missing="$missing VITE_EMAILJS_SERVICE_ID"
          [ -n "$TEMPLATE_ID" ] || missing="$missing VITE_EMAILJS_TEMPLATE_ID"
          [ -n "$PUBLIC_KEY"  ] || missing="$missing VITE_EMAILJS_PUBLIC_KEY"
          if [ -n "$missing" ]; then
            echo "::warning title=Contact form will not send::Missing repository variables:$missing — add them under Settings > Secrets and variables > Actions > Variables."
            exit 0
          fi

          # Deliberately paired with an invalid service id so this can never send a real
          # email; we only care whether EmailJS recognises the account behind the public key.
          # "Account not found" means the key is wrong.
          body=$(curl -s --max-time 20 -X POST 'https://api.emailjs.com/api/v1.0/email/send' \
            -H 'Content-Type: application/json' -H 'Origin: https://vagdevifoods.com' \
            -d "{\"service_id\":\"ci_validation_probe\",\"template_id\":\"$TEMPLATE_ID\",\"user_id\":\"$PUBLIC_KEY\",\"template_params\":{}}" || echo "probe-failed")

          case "$body" in
            *"Account not found"*)
              echo "::warning title=Contact form will not send::EmailJS does not recognise VITE_EMAILJS_PUBLIC_KEY. Copy the current key from the EmailJS dashboard (Account > General > Public Key) and update the repository variable." ;;
            probe-failed)
              echo "Could not reach EmailJS to validate the key; skipping." ;;
            *)
              echo "EmailJS variables present and the public key resolves to an account." ;;
          esac

      - name: Typecheck, lint, build and check SEO
        # The same pre-flight a pull request runs (ci.yml) — repeated here because main can
        # also change without a PR. Stops the deploy before anything is published.
        #
        # The EmailJS values are repository *variables* (not secrets): all three are embedded
        # in the client bundle and readable in the browser, so they are not sensitive.
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ vars.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ vars.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ vars.VITE_EMAILJS_PUBLIC_KEY }}
        run: npm run check

      - name: Verify build output
        # Fail loudly here rather than publishing a broken site. The CNAME is what keeps
        # the custom domain attached — GitHub Pages drops it if the file goes missing.
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/CNAME     || { echo "::error::dist/CNAME missing — custom domain would be lost"; exit 1; }
          test -f dist/sitemap.xml && test -f dist/llms.txt || { echo "::error::sitemap.xml or llms.txt missing"; exit 1; }
          echo "Build size: $(du -sh dist | cut -f1)"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "deploy: ${{ github.event.head_commit.message }}"

      - name: Confirm the site is live
        # A successful push to gh-pages is not a live site: GitHub Pages builds it separately,
        # and the custom domain sits in front of that. Wait until vagdevifoods.com serves this
        # build's bundle, then check every page in the sitemap answers 200 with its own title.
        # A wrong page fails the run; Pages being slow only warns. The query string sidesteps
        # the CDN's 10-minute cache.
        #
        # It also checks www.vagdevifoods.com and warns on every run until it redirects to the
        # apex over valid HTTPS — see "Custom domain" in the README.
        run: |
          bust="v=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bundle=$(grep -o 'src="/assets/index-[^"]*\.js"' dist/index.html | head -1)
          live=""
          for i in $(seq 1 30); do
            curl -sf --max-time 10 "https://vagdevifoods.com/?$bust" | grep -qF "$bundle" && { live=1; break; }
            sleep 10
          done
          if [ -z "$live" ]; then
            echo "::warning title=New build not live yet::vagdevifoods.com was still serving the previous build after 5 minutes. Check the 'pages build and deployment' run."
          else
            echo "New build is live."
            failed=0
            for loc in $(grep -o '<loc>[^<]*' dist/sitemap.xml | sed 's/<loc>//'); do
              path=${loc#https://vagdevifoods.com}
              file=dist/index.html; [ "$path" != "/" ] && file="dist${path}.html"
              want=$(grep -o '<title[^>]*>[^<]*</title>' "$file" | head -1)
              page=$(curl -s --max-time 15 -w '\n%{http_code}' "$loc?$bust" || true)
              code=$(printf '%s' "$page" | tail -n1)
              if [ "$code" = 200 ] && printf '%s' "$page" | grep -qF "$want"; then
                echo "OK  $code  $loc"
              else
                echo "::error title=Live page is wrong::$loc returned HTTP $code or not the page this build produced"
                failed=1
              fi
            done
          fi

          if ! www=$(curl -sS -o /dev/null --max-time 15 -w '%{http_code} %{redirect_url}' https://www.vagdevifoods.com/ 2>&1); then
            www=$(printf '%s' "$www" | tr '\n' ' ')
            echo "::warning title=www.vagdevifoods.com has no valid HTTPS::Visitors who type www see a security warning ($www). Fix the DNS and re-add the custom domain — see 'Custom domain' in the README."
          else
            case "$www" in
              30[1278]\ https://vagdevifoods.com/*) echo "www redirects to the main domain: $www" ;;
              *) echo "::warning title=www.vagdevifoods.com does not redirect::Expected a redirect to https://vagdevifoods.com/, got: $www" ;;
            esac
          fi
          exit ${failed:-0}

      - name: Ping IndexNow
        # IndexNow tells Bing (and Yandex, Seznam, Naver) which URLs changed, so they are
        # recrawled in hours instead of weeks. Bing's index also feeds ChatGPT search and
        # Copilot. Google does not take part; it reads sitemap.xml.
        #
        # The key is public by design: search engines verify a ping by fetching
        # https://vagdevifoods.com/<key>.txt, which is public/<key>.txt. The step above has
        # usually confirmed the site is live; the short wait covers the case where it timed out.
        # A failed ping must never fail a deploy.
        continue-on-error: true
        env:
          INDEXNOW_KEY: c8156be615d309b75df79a1af708abd4
        run: |
          for i in $(seq 1 18); do
            curl -sf "https://vagdevifoods.com/$INDEXNOW_KEY.txt" >/dev/null && break
            sleep 10
          done
          urls=$(grep -o '<loc>[^<]*' dist/sitemap.xml | sed 's/<loc>//' | jq -R . | jq -s .)
          body=$(jq -n --arg key "$INDEXNOW_KEY" --argjson urls "$urls" \
            '{host: "vagdevifoods.com", key: $key, keyLocation: ("https://vagdevifoods.com/" + $key + ".txt"), urlList: $urls}')
          curl -s -o /dev/null -w "IndexNow responded HTTP %{http_code}\n" --max-time 30 \
            -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body"
