# Keeps dependencies and the workflow's actions current, so fixes arrive as reviewed pull
# requests instead of as deploy warnings — the Node 20 deprecation sat on every run for weeks.
# Every Dependabot PR runs the full check (ci.yml) before anyone has to look at it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps land together as one PR a month; majors come one at a time.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Deliberately held back — see "Dependencies held on purpose" in the README.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: react-router-dom
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
