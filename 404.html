<body class="font-sans bg-brand-bg text-text-body antialiased">
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script>
    // The site previously used hash routing, so links like /#/products may still exist
    // in the wild and in search results. Rewrite them to the real path before the app
    // boots, so those visitors land on the right page instead of the homepage.
    (function () {
      var h = window.location.hash;
      if (h.indexOf('#/') === 0) {
        var path = h.slice(1) || '/';
        window.history.replaceState(null, '', path + window.location.search);
        return;
      }
      // Each route is also written as a bare .html file so static hosts can serve
      // extensionless URLs. If someone lands on /about.html directly, normalise it to
      // /about so the router matches the route and the canonical URL agrees.
      var p = window.location.pathname;
      if (/\.html$/.test(p) && !/(^|\/)(index|404)\.html$/.test(p)) {
        window.history.replaceState(null, '', p.replace(/\.html$/, '') + window.location.search + window.location.hash);
      }
    })();
  </script>
