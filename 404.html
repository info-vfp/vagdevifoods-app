  <!--
    Latin fonts only. The four Noto script faces (Devanagari / Telugu / Tamil / Kannada) are
    NOT loaded here — they are injected by context/LanguageContext.tsx if and when a visitor
    picks one of those languages. Requesting all seven up front cost every English visitor
    about 2s of render-blocking time for fonts they would never see.

    Loaded via preload + onload so the stylesheet does not block first paint. `display=swap`
    means text paints immediately in a fallback face and swaps when the webfont arrives.
  -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap"
    onload="this.onload=null;this.rel='stylesheet'">

      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap">

<body class="font-sans bg-brand-bg text-text-body antialiased">
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script>
    // The site previously used hash routing, so links like /#/products may still exist
    // in the wild and in search results. Rewrite them to the real path before the app
    // boots, so those visitors land on the right page instead of the homepage.
    (function () {
      var h = window.location.hash;
      if (h.indexOf('#/') === 0) {
        var path = h.slice(1) || '/';
        window.history.replaceState(null, '', path + window.location.search);
        return;
      }
      // Each route is also written as a bare .html file so static hosts can serve
      // extensionless URLs. If someone lands on /about.html directly, normalise it to
      // /about so the router matches the route and the canonical URL agrees.
      var p = window.location.pathname;
      if (/\.html$/.test(p) && !/(^|\/)(index|404)\.html$/.test(p)) {
        window.history.replaceState(null, '', p.replace(/\.html$/, '') + window.location.search + window.location.hash);
      }
    })();
  </script>
</body>
